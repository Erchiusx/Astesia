services:
  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18864:18864"
    volumes:
      - ${AGENT_CONFIG_DIR:?Set AGENT_CONFIG_DIR}:/config:ro
      - ${AGENT_DATA_DIR:?Set AGENT_DATA_DIR}:/data
    environment:
      PERSONAL_AGENT_TIMEZONE: ${AGENT_TIMEZONE:-UTC}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
