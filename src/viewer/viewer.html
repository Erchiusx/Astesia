<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="agent-nonce" content="__NONCE__"><title>助手 · 会话</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><div class="layout"><aside><h1>助手 <small>Personal Agent</small></h1><p>把值得记住的日常，慢慢串起来。</p><button id="new">开始新对话</button><nav id="sessions" aria-label="会话列表"></nav><details><summary>保存的记忆</summary><ul id="memories"></ul></details><details id="reviews"><summary id="review-summary">待确认语音</summary><div id="voice-inbox"></div></details></aside>
<main><header><div><strong id="title">当前会话</strong><span id="status" role="status">连接中…</span></div><button id="continue" hidden>继续这个会话</button></header><div id="error" role="alert" hidden></div><button id="older" hidden>更早的消息</button><section id="turns" aria-live="polite"></section><form id="compose"><label for="question">想和助手说些什么？</label><textarea id="question" rows="3" placeholder="这里和快捷指令、Zello 使用同一份对话与记忆。" maxlength="8000" required></textarea><div class="send-row"><small>回答也会通过 Zello 播报</small><button type="submit" id="send">发送</button></div></form></main></div></body></html>
